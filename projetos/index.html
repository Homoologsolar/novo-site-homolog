<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organização de Projeto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animação personalizada para a barra de progresso infinita */
        .progress-bar-inner {
            width: 50%;
            height: 100%;
            background-color: #eab308; /* Amarelo sol */
            border-radius: 9999px;
            animation: indeterminate 1.5s ease-in-out infinite alternate;
        }
        @keyframes indeterminate {
            0% { transform: translateX(-10%); width: 20%; }
            100% { transform: translateX(350%); width: 40%; }
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans text-gray-800">

    <div id="loadingOverlay" class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-all duration-300">
        
        <svg class="animate-spin text-yellow-500 w-20 h-20 mb-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>

        <h3 class="text-xl font-bold text-gray-800 mb-2" id="loadingText">Extraindo dados com IA...</h3>
        <p class="text-sm text-gray-500 mb-6">Isso pode levar alguns segundos dependendo do tamanho do PDF.</p>

        <div class="w-64 h-2 bg-gray-200 rounded-full overflow-hidden">
            <div class="progress-bar-inner"></div>
        </div>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100 relative overflow-hidden ">
        
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-400 to-blue-600"></div>

        <div class="mb-8 text-center mt-2">
            <h2 class="text-2xl font-bold text-gray-800">Organização de Projeto</h2>
            <p class="text-sm text-gray-500 mt-2">Envie os documentos do projeto para geração automatizada.</p>
        </div>

        <form id="uploadForm" class="space-y-6">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2" for="docIdentificacao">
                    Documento de Identificação <span class="text-red-500">*</span>
                </label>
                <input type="file" id="docIdentificacao" name="docIdentificacao" accept=".pdf, image/jpeg, image/png" required
                    class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2.5 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-bold
                    file:bg-gray-100 file:text-gray-700
                    hover:file:bg-gray-200 transition-all
                    border border-gray-200 rounded-lg p-1.5 cursor-pointer focus:ring-2 focus:ring-yellow-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2" for="contaEnergia">
                    Conta de Energia <span class="text-red-500">*</span>
                </label>
                <input type="file" id="contaEnergia" name="contaEnergia" accept=".pdf, image/jpeg, image/png" required
                    class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2.5 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-bold
                    file:bg-gray-100 file:text-gray-700
                    hover:file:bg-gray-200 transition-all
                    border border-gray-200 rounded-lg p-1.5 cursor-pointer focus:ring-2 focus:ring-yellow-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2" for="descKit">
                    Descrição do Kit <span class="text-gray-400 font-normal text-xs">(Opcional)</span>
                </label>
                <input type="file" id="descKit" name="descKit" accept=".pdf, image/jpeg, image/png" 
                    class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2.5 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-bold
                    file:bg-yellow-50 file:text-yellow-700
                    hover:file:bg-yellow-100 transition-all
                    border border-gray-200 rounded-lg p-1.5 cursor-pointer focus:ring-2 focus:ring-yellow-500 focus:outline-none">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-gray-900 text-white font-bold py-3.5 px-4 rounded-lg hover:bg-gray-800 transition-all transform active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-gray-200 shadow-lg mt-2">
                Processar Documentos
            </button>
        </form>

        <div id="statusMessage" class="mt-5 text-center text-sm hidden font-bold rounded-lg p-3"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            // URL DO WEBHOOK
            const N8N_WEBHOOK_URL = 'https://arrumar-projeto.onrender.com/webhook/6a1987c0-fb16-4b8c-a8c0-df6fa15f81c3';

            const formData = new FormData();
            formData.append('contaEnergia', document.getElementById('contaEnergia').files[0]);
            formData.append('docIdentificacao', document.getElementById('docIdentificacao').files[0]);
            
            const kitInput = document.getElementById('descKit');
            if (kitInput.files.length > 0) {
                formData.append('descricaoKit', kitInput.files[0]);
            }

            // Exibe a tela de carregamento (Overlay)
            loadingOverlay.classList.remove('hidden');
            statusMessage.classList.add('hidden');

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = downloadUrl;
                    a.download = 'DADOS_DO_CLIENTE_PROCESSADO.xls'; 
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(downloadUrl); 

                    // Mensagem de Sucesso
                    statusMessage.className = 'mt-5 text-center text-sm font-bold bg-green-50 text-green-700 block rounded-lg p-3 border border-green-200';
                    statusMessage.textContent = '✅ Planilha gerada e baixada com sucesso!';
                    form.reset();
                } else {
                    throw new Error('Erro na resposta do servidor');
                }
            } catch (error) {
                // Mensagem de Erro
                statusMessage.className = 'mt-5 text-center text-sm font-bold bg-red-50 text-red-700 block rounded-lg p-3 border border-red-200';
                statusMessage.textContent = '❌ Erro ao processar. Verifique a conexão com o servidor.';
                console.error('Erro:', error);
            } finally {
                // Esconde a tela de carregamento independente do resultado
                loadingOverlay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
